<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Documentación de Widgets — JYPESA</title>
  <link rel="icon" type="image/svg+xml" href="https://cdn.prod.website-files.com/69d7c3721733f0f4aaa00b42/6a441a5d045393e9bab3f309_logo%20jypesa%20svg.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Montserrat:wght@400;500;600;700&family=Rubik:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #506D85;
      --primary-dark: #374E61;
      --primary-light: #EEF7FA;
      --blue: #0088BD;
      --cyan: #48A9C5;
      --teal: #9EF4F5;
      --green: #4AA25D;
      --amber: #FBB31F;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --border-focus: #48A9C5;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(80, 109, 133, 0.08);
      --shadow-lg: 0 12px 32px rgba(80, 109, 133, 0.12);
      --radius: 12px;
      --radius-sm: 8px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Rubik', sans-serif;
      color: var(--text);
      background-color: var(--bg);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── HEADER SUPERIOR ────────────────────────────────────── */
    header.portal-header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      height: 38px;
      width: auto;
      object-fit: contain;
    }

    .brand-divider {
      width: 1px;
      height: 28px;
      background: var(--border);
    }

    .brand-title {
      display: flex;
      flex-direction: column;
    }

    .brand-title h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.3px;
    }

    .brand-title span {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ECFDF5;
      color: #065F46;
      border: 1px solid #A7F3D0;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-status .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10B981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .btn-portal {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition);
      cursor: pointer;
    }

    .btn-portal-primary {
      background: var(--cyan);
      color: #FFFFFF;
      border: 1px solid transparent;
    }

    .btn-portal-primary:hover {
      background: #3996B0;
      transform: translateY(-1px);
    }

    .btn-portal-outline {
      background: #FFFFFF;
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .btn-portal-outline:hover {
      background: var(--primary-light);
      border-color: var(--cyan);
      color: var(--blue);
    }

    /* ── BARRA DE BÚSQUEDA Y FILTROS ────────────────────────── */
    .search-filter-bar {
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
    }

    .search-filter-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 280px;
      max-width: 480px;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 18px;
      height: 18px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 42px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-family: 'Rubik', sans-serif;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: var(--transition);
      background: var(--bg);
    }

    .search-box input:focus {
      border-color: var(--cyan);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(72, 169, 197, 0.15);
    }

    .filter-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .pill-btn {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }

    .pill-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .pill-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
      font-weight: 600;
    }

    /* ── LAYOUT PRINCIPAL (2 COLUMNAS) ──────────────────────── */
    .portal-main {
      flex: 1;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      align-items: flex-start;
      box-sizing: border-box;
    }

    @media (max-width: 1024px) {
      .portal-main {
        grid-template-columns: 1fr;
      }
    }

    /* ── COLUMNA IZQUIERDA: LISTA DE WIDGETS ────────────────── */
    .sidebar-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 180px);
      position: sticky;
      top: 100px;
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FDFEFE;
    }

    .sidebar-header h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
    }

    .widget-count-badge {
      font-size: 0.75rem;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .widget-list-scroll {
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .widget-item {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      background: transparent;
      width: 100%;
    }

    .widget-item:hover {
      background: var(--primary-light);
      border-color: rgba(72, 169, 197, 0.3);
    }

    .widget-item.active {
      background: #F0F9FF;
      border-color: var(--cyan);
      box-shadow: 0 2px 6px rgba(72, 169, 197, 0.15);
    }

    .widget-item-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: var(--transition);
    }

    .widget-item.active .widget-item-icon {
      background: var(--cyan);
      color: #FFFFFF;
    }

    .widget-item-text {
      flex: 1;
      min-width: 0;
    }

    .widget-item-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .widget-item.active .widget-item-title {
      color: var(--blue);
    }

    .widget-item-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .widget-item-tags {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .tag-mini {
      font-size: 0.68rem;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 500;
      background: #F1F5F9;
      color: var(--text-muted);
    }

    .tag-mini.cms {
      background: #FEF3C7;
      color: #92400E;
    }

    .tag-mini.bilingual {
      background: #E0E7FF;
      color: #3730A3;
    }

    /* ── COLUMNA DERECHA: DETALLE DEL WIDGET ────────────────── */
    .detail-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .detail-hero {
      padding: 28px 32px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }

    .detail-header-left {
      flex: 1;
      min-width: 320px;
    }

    .detail-category-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .detail-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .detail-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 800px;
    }

    .detail-badges {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .badge-feature {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-feature.production {
      background: #EEF7FA;
      color: var(--blue);
      border: 1px solid rgba(72, 169, 197, 0.3);
    }

    .badge-feature.cms {
      background: #FEF3C7;
      color: #B45309;
      border: 1px solid #FDE68A;
    }

    .badge-feature.lang {
      background: #EDE9FE;
      color: #6D28D9;
      border: 1px solid #DDD6FE;
    }

    .detail-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    @media (max-width: 768px) {
      .detail-actions {
        width: 100%;
        align-items: stretch;
      }
    }

    .btn-copy-embed {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--primary);
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(80, 109, 133, 0.2);
      transition: var(--transition);
    }

    .btn-copy-embed:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(80, 109, 133, 0.3);
    }

    .btn-preview-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #FFFFFF;
      color: var(--cyan);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border);
      text-decoration: none;
      transition: var(--transition);
    }

    .btn-preview-link:hover {
      background: var(--primary-light);
      border-color: var(--cyan);
    }

    /* ── TABS DE CONTENIDO DEL DETALLE ──────────────────────── */
    .detail-tabs-nav {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: #FFFFFF;
      padding: 0 32px;
      gap: 24px;
      overflow-x: auto;
    }

    .detail-tab-btn {
      padding: 16px 0;
      border: none;
      background: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .detail-tab-btn:hover {
      color: var(--primary);
    }

    .detail-tab-btn.active {
      color: var(--blue);
    }

    .detail-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--cyan);
      border-radius: 3px 3px 0 0;
    }

    .detail-content {
      padding: 32px;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── BLOQUES DE CÓDIGO Y ESTILOS DE DOCUMENTACIÓN ───────── */
    .code-block-container {
      position: relative;
      margin: 16px 0 24px 0;
      border-radius: var(--radius-sm);
      background: #0F172A;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
    }

    .code-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: #1E293B;
      border-bottom: 1px solid #334155;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #94A3B8;
    }

    .btn-copy-code {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: #E2E8F0;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-copy-code:hover {
      background: var(--cyan);
      border-color: var(--cyan);
      color: #FFFFFF;
    }

    pre code {
      display: block;
      padding: 16px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #E2E8F0;
      overflow-x: auto;
      line-height: 1.6;
    }

    .section-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      margin: 24px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    p.guide-text {
      font-size: 0.92rem;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    /* Tablas elegantes */
    .table-container {
      overflow-x: auto;
      margin: 16px 0 24px 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }

    table.guide-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    table.guide-table th {
      background: #F8FAFC;
      padding: 12px 16px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
    }

    table.guide-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: #334155;
    }

    table.guide-table tr:last-child td {
      border-bottom: none;
    }

    table.guide-table tr:hover td {
      background: #F8FAFC;
    }

    .badge-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      background: #F1F5F9;
      color: #0F172A;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #E2E8F0;
    }

    /* Caja de alerta / tip */
    .callout-box {
      border-left: 4px solid var(--cyan);
      background: #F0F9FF;
      padding: 14px 18px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      margin: 20px 0;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .callout-box svg {
      width: 20px;
      height: 20px;
      color: var(--cyan);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .callout-box-text {
      font-size: 0.88rem;
      color: #0369A1;
      line-height: 1.5;
    }

    /* Vista previa interactiva */
    .preview-frame-container {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #FFFFFF;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
    }

    .preview-frame-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #F8FAFC;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 10px;
    }

    .preview-viewport-controls {
      display: flex;
      gap: 8px;
    }

    .btn-viewport {
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .btn-viewport.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 600px;
      background: #FFFFFF;
      display: flex;
      justify-content: center;
      transition: var(--transition);
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      transition: width 0.3s ease;
    }

    /* ── TOAST NOTIFICATION ─────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0F172A;
      color: #FFFFFF;
      padding: 14px 22px;
      border-radius: var(--radius-sm);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 9999;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast svg {
      width: 18px;
      height: 18px;
      color: #10B981;
    }

    /* ── FOOTER ─────────────────────────────────────────────── */
    footer.portal-footer {
      background: #FFFFFF;
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="portal-header">
    <div class="header-inner">
      <div class="brand-group">
        <img class="brand-logo" src="https://cdn.prod.website-files.com/69d7c3721733f0f4aaa00b42/6a441a5d045393e9bab3f309_logo%20jypesa%20svg.svg" alt="JYPESA Logo">
        <div class="brand-divider"></div>

          w.name.toLowerCase().includes(q) || 
          w.shortDesc.toLowerCase().includes(q) ||

      const activeBtn = Array.from(document.querySelectorAll('.detail-tab-btn')).find(b => b.onclick.toString().includes(tabName));
      if (activeBtn) activeBtn.classList.add('active');

      const targetPanel = document.getElementById(`panel-${tabName}`);
      if (targetPanel) targetPanel.classList.add('active');
    }

    function setViewport(size) {

        iframe.style.width = '100%';
      } else if (size === 'tablet') {
        iframe.style.width = '768px';
      } else if (size === 'mobile') {
        iframe.style.width = '390px';
      }
    }

    function copyWidgetEmbed(widgetId) {
      const widget = WIDGETS_DATA.find(w => w.id === widgetId);
      if (!widget) return;

      navigator.clipboard.writeText(widget.embedCode).then(() => {
        showToast(`¡Código embed de "${widget.name}" copiado!`);
      }).catch(err => {
        console.error("Error al copiar:", err);
      });
    }

    function showToast(message) {
      toastMessage.textContent = message;
      toastNotification.classList.add("show");
      setTimeout(() => {
        toastNotification.classList.remove("show");
      }, 3000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function setupEventListeners() {
      // Búsqueda en vivo
      widgetSearchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        renderWidgetList();
      });

      // Filtro por categorías
      categoryFilterContainer.addEventListener("click", (e) => {
        const btn = e.target.closest(".pill-btn");
        if (!btn) return;
        categoryFilterContainer.querySelectorAll(".pill-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCategory = btn.getAttribute("data-category");
        renderWidgetList();
      });
    }

    // Arrancar la app al cargar el DOM
    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>

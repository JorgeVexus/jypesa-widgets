<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Multi-Select Test - Jypesa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="contacto-multiselect.css">
  <style>
    :root {
      --_jypesa-brand---font-principal: 'Rubik', sans-serif;
      --_jypesa-brand---brand-principal: #506d85;
    }
    body {
      font-family: 'Rubik', sans-serif;
      background-color: #f8fafc;
      padding: 40px 20px;
      color: #203646;
    }
    .card {
      max-width: 520px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      padding: 32px;
    }
    .field-label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: #506d85;
      font-size: 15px;
    }
    .text-field {
      width: 100%;
      min-height: 50px;
      padding: 10px 16px;
      border: 1px solid #d1d5dc;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
      margin-bottom: 20px;
    }
    .form-row {
      margin-bottom: 24px;
    }
    .output-box {
      margin-top: 24px;
      padding: 16px;
      background: #f1f5f9;
      border-radius: 8px;
      font-size: 13px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2 style="margin-top: 0; color: #1e293b; font-size: 22px;">Contact Form Multi-Select (Jypesa USA)</h2>
    <p style="color: #64748b; font-size: 14px; margin-bottom: 24px;">Matches exact 10 English collections from the menu.</p>

    <form id="test-form" onsubmit="event.preventDefault(); showData();">
      <div class="form-row">
        <label class="field-label">Contact name *</label>
        <input type="text" class="text-field" placeholder="John Doe" required>
      </div>

      <div class="form-row">
        <label class="field-label">Collection of interest</label>
        <select id="collection-interest" name="Coleccion_interes" class="text-field">
          <option value="">Select collections...</option>
          <option value="Elements">Elements</option>
          <option value="Tea Leaf">Tea Leaf</option>
          <option value="Rainforest">Rainforest</option>
          <option value="A&O">A&O</option>
          <option value="Cava">Cava</option>
          <option value="Biogena">Biogena</option>
          <option value="Lavarino Cosso">Lavarino Cosso</option>
          <option value="Vervan">Vervan</option>
          <option value="Persea">Persea</option>
          <option value="Agavia">Agavia</option>
        </select>
      </div>

      <button type="submit" style="width:100%; min-height:48px; background:#506d85; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer;">Submit Form</button>
    </form>

    <div id="output" class="output-box" style="display:none;"></div>
  </div>

  <script src="contacto-multiselect.js"></script>
  <script>
    function showData() {
      const hidden = document.getElementById('collection-interest-hidden');
      const out = document.getElementById('output');
      out.style.display = 'block';
      out.textContent = "Submitted Value for 'Coleccion_interes':\n" + (hidden ? hidden.value : "None");
    }
  </script>
</body>
</html>

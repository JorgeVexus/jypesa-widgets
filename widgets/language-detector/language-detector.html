<!-- JYPESA — Auto Language Detection & Redirect Script (Custom Code Head)    -->
<!-- Pegar este bloque en: Webflow > Site Settings > Custom Code > Head Code  -->
<!-- ========================================================================= -->
<script>
(function () {
  'use strict';

  // 1. Evitar redirección para bots/crawlers de motores de búsqueda (SEO)
  var botPattern = /googlebot|bingbot|yandex|baiduspider|facebookexternalhit|twitterbot|rogerbot|linkedinbot|embedly|quora link preview|showyoubot|outbrain|pinterest|slackbot|vkShare|W3C_Validator/i;
  if (botPattern.test(navigator.userAgent)) return;

  var pathname = window.location.pathname.replace(/\/$/, '') || '/';
  var search = window.location.search;
  var hash = window.location.hash;

  // 2. Soporte para forzar idioma por URL (ej: ?lang=en o ?lang=es)
  var urlParams = new URLSearchParams(search);
  var queryLang = urlParams.get('lang');
  if (queryLang === 'en' || queryLang === 'es') {
    try {
      localStorage.setItem('jypesa_lang', queryLang);
    } catch (e) {}
  }

  // 3. Obtener preferencia guardada en localStorage
  var savedLang = null;
  try {
    savedLang = localStorage.getItem('jypesa_lang');
  } catch (e) {}

  // 4. Si no hay preferencia guardada, detectar el idioma del navegador/celular
  var targetLang = savedLang;
  if (!targetLang) {
    var rawLanguages = navigator.languages || [navigator.language || navigator.userLanguage || 'es'];
    var isEnglish = false;
    for (var i = 0; i < rawLanguages.length; i++) {
      var langCode = (rawLanguages[i] || '').toLowerCase();
      if (langCode.startsWith('en')) {
        isEnglish = true;
        break;
      }
      if (langCode.startsWith('es')) {
        isEnglish = false;
        break;
      }
    }
    targetLang = isEnglish ? 'en' : 'es';
  }

  // El inglés ahora vive en un dominio separado (jypesausa.com), no bajo /en.
  var isOnUsaSite = window.location.hostname.toLowerCase().indexOf('jypesausa.com') !== -1;

  // Si el usuario debe estar en inglés y no está ya en el sitio en inglés:
  if (targetLang === 'en' && !isOnUsaSite) {
    var targetUrl = getEnglishUrl(pathname);
    if (targetUrl) {
      window.location.replace(targetUrl + search + hash);
    }
  }

  // Mapeo inteligente de rutas de Español (jypesa.com) -> Inglés (jypesausa.com)
  function getEnglishUrl(path) {
    var USA_ORIGIN = 'https://jypesausa.com';
    if (path === '/' || path === '' || path === '/inicio') return USA_ORIGIN + '/';
    if (path === '/nosotros') return USA_ORIGIN + '/about-us';
    if (path === '/contacto') return USA_ORIGIN + '/contact';
    if (path === '/desarollo-personalizado') return USA_ORIGIN + '/custom-development';
    if (path === '/sustentabilidad') return USA_ORIGIN + '/sustainability';
    if (path === '/sistemas-de-dispensacion') return USA_ORIGIN + '/dispensing-systems';
    if (path === '/accesorios') return USA_ORIGIN + '/accessories';
    if (path === '/soluciones') return USA_ORIGIN + '/solutions';
    if (path === '/blogs') return USA_ORIGIN + '/blogs';
    if (path === '/shop') return USA_ORIGIN + '/shop';

    // Mapeo de Colecciones de Productos
    if (path.startsWith('/colecciones/')) {
      var prod = path.slice('/colecciones/'.length);
      if (prod.startsWith('estandar/')) {
        return USA_ORIGIN + '/collections/standar/' + prod.slice('estandar/'.length);
      }
      if (prod.startsWith('superior/')) {
        return USA_ORIGIN + '/collections/superior/' + prod.slice('superior/'.length);
      }
      if (prod.startsWith('premium/')) {
        return USA_ORIGIN + '/collections/premium/' + prod.slice('premium/'.length);
      }
      if (prod.startsWith('lujo/')) {
        return USA_ORIGIN + '/collections/luxury/' + prod.slice('lujo/'.length);
      }
      return USA_ORIGIN + '/collections/' + prod;
    }

    // Ruta por defecto si es otra página
    return USA_ORIGIN + path;
  }
})();
</script>
